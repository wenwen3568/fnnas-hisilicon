name: Build FnNAS Hi3798MV100 Image
on:
  workflow_dispatch:
    inputs:
      kernel_version:
        description: Kernel version (e.g., 6.6.y, 6.12.y)
        required: true
        default: 6.6.y
        type: choice
        options:
        - 6.6.y
        - 6.12.y
        - 6.18.y
      board:
        description: Target board
        required: true
        default: ec6100v9c
        type: choice
        options:
        - ec6100v9c
      rootfs_size:
        description: Rootfs size in MiB
        required: true
        default: '6144'
        type: string
      rootfs_expand:
        description: Rootfs auto-expand size in GiB
        required: true
        default: '16'
        type: string
      builder_name:
        description: Builder signature
        required: false
        default: fnnas-hisilicon
        type: string
permissions:
  contents: write
  actions: write
jobs:
  build:
    name: Build FnNAS Hi3798MV100 Image
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Set up build environment
      run: |
        sudo apt-get update -y
        sudo apt-get install -y \
          gcc-aarch64-linux-gnu \
          g++-aarch64-linux-gnu \
          gcc-arm-linux-gnueabihf \
          g++-arm-linux-gnueabihf \
          make \
          bc \
          bison \
          flex \
          libssl-dev \
          libelf-dev \
          device-tree-compiler \
          u-boot-tools \
          parted \
          dosfstools \
          e2fsprogs \
          btrfs-progs \
          xz-utils \
          curl \
          wget \
          git \
          python3 \
          python3-pip \
          qemu-user-static \
          binfmt-support \
          debootstrap \
          debian-archive-keyring \
          cpio \
          zstd \
          lz4 \
          pigz \
          rsync \
          patch \
          libgnutls28-dev
    - name: Determine kernel branch
      id: kernel_branch
      run: |
        KERNEL_VER="${{ github.event.inputs.kernel_version }}"
        BRANCH="v${KERNEL_VER%.y}"
        echo "branch=$BRANCH" >> $GITHUB_OUTPUT
    - name: Download base fnOS image
      run: |
        mkdir -p build/base
        cd build/base
        wget -c "https://github.com/ophub/fnnas/releases/download/fnnas_base_image/fnnas-official-arm64-image_amlogic_1252.img.gz" -O fnnas-base.img.gz
        xz -d -k fnnas-base.img.gz
        echo "FNOS_BASE_IMAGE=$(pwd)/fnnas-base.img" >> $GITHUB_ENV
    - name: Clone Linux kernel
      run: |
        mkdir -p build/kernel
        cd build/kernel
        git clone --depth=1 --branch "${{ steps.kernel_branch.outputs.branch }}" https://github.com/torvalds/linux linux
    - name: Apply Hi3798MV100 kernel patches
      run: |
        cd build/kernel/linux
        # Skip 0001 (rename, not needed for 6.6)
        # Skip 0002-dt-bindings (context mismatch on newer kernel, handled in DT bindings step)
        # Skip 0003-clk (CRG driver handled separately)
        for patch in ${{ github.workspace }}/kernel/patches/0002-*.patch; do
          base=$(basename "$patch")
          if [[ "$base" == 0002-dt-bindings* ]]; then
            echo "Skipping $patch (dt-bindings context mismatch, handled separately)"
            continue
          fi
          echo "Applying $patch"
          patch -p1 --forward < "$patch" || { echo "Failed to apply $patch"; exit 1; }
        done
        for patch in ${{ github.workspace }}/kernel/patches/0003-*.patch; do
          base=$(basename "$patch")
          if [[ "$base" == 0003-clk* ]]; then
            echo "Skipping $patch (CRG driver handled separately)"
            continue
          fi
          echo "Applying $patch"
          patch -p1 --forward < "$patch" || { echo "Failed to apply $patch"; exit 1; }
        done
        # Verify patches applied
        echo "=== Verifying patches applied ==="
        ls -la drivers/clk/hisilicon/
        grep -r "hi3798mv100" drivers/clk/hisilicon/ || true
    - name: Copy Hi3798MV100 CRG driver
      run: |
        cd build/kernel/linux
        # Copy the CRG driver from repo
        mkdir -p drivers/clk/hisilicon
        cp ${{ github.workspace }}/kernel/driver/crg-hi3798.c drivers/clk/hisilicon/
        # Add the new driver to Makefile
        echo "obj-\$(CONFIG_COMMON_CLK_HI3798) += crg-hi3798.o" >> drivers/clk/hisilicon/Makefile
        # Verify driver file copied
        ls -la drivers/clk/hisilicon/crg-hi3798.c
        grep -q "hi3798mv100" drivers/clk/hisilicon/crg-hi3798.c && echo "Driver copied successfully"
    - name: Copy DTS file and add to kernel Makefile
      run: |
        set -euxo pipefail
        KERNEL=build/kernel/linux
        mkdir -p "$KERNEL/arch/arm64/boot/dts/hisilicon"
        cp "${{ github.workspace }}/dtb/hi3798mv100-ec6100v9c.dts"   "$KERNEL/arch/arm64/boot/dts/hisilicon/"
        # Add the DTS to the hisilicon subdir makefile
        printf "dtb-y += hi3798mv100-ec6100v9c.dtb\n" >>   "$KERNEL/arch/arm64/boot/dts/hisilicon/Makefile"
        # Also add the top-level entry so the kernel can resolve the target correctly
        if ! grep -q "hisilicon/hi3798mv100-ec6100v9c.dtb" "$KERNEL/arch/arm64/boot/dts/Makefile"; then
          printf "\n# Added for Hi3798MV100\n" >> "$KERNEL/arch/arm64/boot/dts/Makefile"
          printf "dtb-y += hisilicon/hi3798mv100-ec6100v9c.dtb\n" >> "$KERNEL/arch/arm64/boot/dts/Makefile"
        fi
        echo "=== DTS makefile ==="
        grep -n "hi3798mv100-ec6100v9c" "$KERNEL/arch/arm64/boot/dts/Makefile" || true
        grep -n "hi3798mv100-ec6100v9c" "$KERNEL/arch/arm64/boot/dts/hisilicon/Makefile" || true
    - name: Apply Hi3798MV100 DT bindings (add missing clocks 64-68)
      run: |
        cd build/kernel/linux
        if ! grep -q 'hisilicon,hi3798mv100-crg' Documentation/devicetree/bindings/clock/hisi-crg.txt; then
          sed -i '/hisilicon,hi3519-crg/a\\    - "hisilicon,hi3798mv100-crg"\\n    - "hisilicon,hi3798mv100-sysctrl"' Documentation/devicetree/bindings/clock/hisi-crg.txt
        fi
        if ! grep -q 'HISTB_VPU_CLK' include/dt-bindings/clock/histb-clock.h; then
          awk '
            /HISTB_USB3_SUSPEND_CLK1/ {
              print
              print "#define HISTB_USB2_UTMI_CLK1		51"
              print "#define HISTB_USB2_2_BUS_CLK		52"
              print "#define HISTB_USB2_2_PHY_CLK		53"
              print "#define HISTB_USB2_2_UTMI_CLK		54"
              print "#define HISTB_USB2_2_UTMI_CLK1		55"
              print "#define HISTB_USB2_2_12M_CLK		56"
              print "#define HISTB_USB2_2_48M_CLK		57"
              print "#define HISTB_USB2_2_OTG_UTMI_CLK	58"
              print "#define HISTB_USB2_2_PHY1_REF_CLK	59"
              print "#define HISTB_USB2_2_PHY2_REF_CLK	60"
              print "#define HISTB_FEPHY_CLK			61"
              print "#define HISTB_GPU_BUS_CLK		62"
              print "#define HISTB_GPU_CORE_CLK		63"
              print "#define HISTB_WDT_CLK			64"
              print "#define HISTB_RTC_CLK			65"
              print "#define HISTB_THERMAL_CLK		66"
              print "#define HISTB_CRYPTO_CLK		67"
              print "#define HISTB_VPU_CLK			68"
              next
            }
            { print }
          ' include/dt-bindings/clock/histb-clock.h > /tmp/histb-clock.h && \
          mv /tmp/histb-clock.h include/dt-bindings/clock/histb-clock.h
        fi
        echo "=== Verifying DT bindings ==="
        grep -n "hisilicon,hi3798mv100" Documentation/devicetree/bindings/clock/hisi-crg.txt || true
        grep -n "HISTB_USB2_2\|HISTB_FEPHY\|HISTB_GPU\|HISTB_WDT\|HISTB_RTC\|HISTB_THERMAL\|HISTB_CRYPTO\|HISTB_VPU" include/dt-bindings/clock/histb-clock.h || true
    - name: Build Linux kernel
      run: |
        set -euxo pipefail

        cd build/kernel/linux

        # use provided config
        cp "${{ github.workspace }}/kernel/config-hi3798mv100" .config

        make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- olddefconfig
        ./scripts/config --enable CONFIG_ARCH_HISILICON
        make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- olddefconfig

        echo "=== Critical configs ==="
        grep -E "CONFIG_(ACPI|COMMON_CLK_HI3798|RESET_HISI|MMC_DW_HISI|HISI_GMAC|PSCI|GIC|ARCH_HISILICON)" .config | sort || true

        # Build kernel image, dtbs and modules together (so modules.order is generated)
        make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- -j$(nproc) Image.gz dtbs modules 2>&1 | tee build_full.log
        BUILD_RC=${PIPESTATUS[0]}
        if [ $BUILD_RC -ne 0 ]; then
          echo "=== BUILD FAILED - FULL BUILD LOG ==="
          sed -n "1,400p" build_full.log || true
          exit $BUILD_RC
        fi

        # Verify DTB exists
        DTB_SRC="${GITHUB_WORKSPACE}/build/kernel/linux/arch/arm64/boot/dts/hisilicon/hi3798mv100-ec6100v9c.dtb"
        if [ -f "$DTB_SRC" ]; then
          echo "DTB generated at $DTB_SRC"
        else
          echo "DTB missing at $DTB_SRC"
          ls -la arch/arm64/boot/dts/hisilicon || true
          exit 1
        fi

        # Ensure build/dtb exists at repo root and copy DTB there (use absolute path to avoid cd confusion)
        mkdir -p "${GITHUB_WORKSPACE}/build/dtb"
        cp "$DTB_SRC" "${GITHUB_WORKSPACE}/build/dtb/"

        # Install modules into the rootfs (check result; modules were built earlier)
        make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- INSTALL_MOD_PATH=../rootfs modules_install 2>&1 | tee modules_install.log
        MI_RC=${PIPESTATUS[0]}
        if [ $MI_RC -ne 0 ]; then
          echo "=== MODULES INSTALL FAILED ==="
          sed -n "1,400p" modules_install.log || true
          exit $MI_RC
        fi

        # show last few lines for quick glance
        tail -n 30 build_full.log || true
        tail -n 30 modules_install.log || true
    - name: Clone U-Boot
      run: |
        mkdir -p build/uboot
        cd build/uboot
        git clone --depth=1 https://github.com/u-boot/u-boot u-boot
    - name: Copy U-Boot DTS
      run: |
        mkdir -p build/uboot/u-boot/arch/arm/dts
        cp ${{ github.workspace }}/uboot/hi3798mv100-ec6100v9c-u-boot.dtsi build/uboot/u-boot/arch/arm/dts/
        ls -la build/uboot/u-boot/arch/arm/dts/hi3798mv100-ec6100v9c-u-boot.dtsi
    - name: Build U-Boot (disable SPL)
      run: |
        cd build/uboot/u-boot
        # Use generic ARM Cortex-A7 defconfig
        make ARCH=arm CROSS_COMPILE=arm-linux-gnueabihf- am335x_evm_defconfig
        # Enable required options for HiSilicon
        ./scripts/config --enable ARCH_HISILICON
        ./scripts/config --enable ARCH_HI3798
        ./scripts/config --enable OF_CONTROL
        ./scripts/config --enable OF_BOARD_SETUP
        ./scripts/config --enable DM
        ./scripts/config --enable DM_REGULATOR
        ./scripts/config --enable DM_REGULATOR_FIXED
        ./scripts/config --enable SERIAL
        ./scripts/config --set-val SYS_MALLOC_F_LEN 0x200000
        ./scripts/config --set-val BOOTDELAY 3
        ./scripts/config --enable CONSOLE_SERIAL
        # Disable SPL to avoid SRAM overflow
        ./scripts/config --disable SPL
        ./scripts/config --disable SPL_NAND_SUPPORT
        ./scripts/config --disable SPL_MMC_SUPPORT
        ./scripts/config --disable SPL_SERIAL_SUPPORT
        ./scripts/config --disable SPL_YMODEM_SUPPORT
        make ARCH=arm CROSS_COMPILE=arm-linux-gnueabihf- -j$(nproc)
    - name: Build Device Tree Blobs
      run: |
        mkdir -p build/dtb
        cd build/kernel/linux
        # Verify DTB was generated
        ls -la arch/arm64/boot/dts/hisilicon/hi3798mv100-ec6100v9c.dtb
        cp arch/arm64/boot/dts/hisilicon/hi3798mv100-ec6100v9c.dtb ../../../dtb/
        # Use kernel DTB for U-Boot as well (compatible)
        cp arch/arm64/boot/dts/hisilicon/hi3798mv100-ec6100v9c.dtb ../../../dtb/u-boot-ec6100v9c.dtb
        ls -la ../../../dtb/u-boot-ec6100v9c.dtb
    - name: Extract base fnOS image
      run: |
        mkdir -p build/extract
        cd build/extract
        loop_dev=$(sudo losetup -fP --show $FNOS_BASE_IMAGE)
        mkdir -p boot root
        sudo mount "${loop_dev}p1" boot
        sudo mount "${loop_dev}p2" root -t btrfs -o compress=zstd:1
        sudo rsync -a root/ ../rootfs/
        sudo umount root boot
        sudo losetup -d $loop_dev
    - name: Replace kernel and DTB
      run: |
        rootfs="build/rootfs"
        sudo mv "$rootfs/boot/Image.gz" "$rootfs/boot/Image.gz.bak" 2>/dev/null || true
        sudo cp build/kernel/linux/arch/arm64/boot/Image.gz "$rootfs/boot/Image.gz"
        sudo mkdir -p "$rootfs/boot/dtb/hisilicon"
        sudo cp build/dtb/hi3798mv100-ec6100v9c.dtb "$rootfs/boot/dtb/hisilicon/"
        sudo rsync -a build/kernel/rootfs/lib/modules/ "$rootfs/lib/modules/"
        if [[ -f "$rootfs/boot/extlinux.conf" ]]; then
          sudo sed -i 's|fdt /boot/dtb/.*|fdt /boot/dtb/hisilicon/hi3798mv100-ec6100v9c.dtb|' "$rootfs/boot/extlinux.conf"
          sudo sed -i 's|linux /boot/Image|linux /boot/Image.gz|' "$rootfs/boot/extlinux.conf"
        fi
        if [[ -f "$rootfs/boot/uEnv.txt" ]]; then
          sudo sed -i 's|fdtfile=.*|fdtfile=hisilicon/hi3798mv100-ec6100v9c.dtb|' "$rootfs/boot/uEnv.txt"
        fi
    - name: Create final image
      run: |
        mkdir -p out
        image_name="fnos_hisilicon_ec6100v9c_$(date +%Y%m%d_%H%M%S).img"
        image_path="out/$image_name"
        total_size_mb=$((512 + ${{ github.event.inputs.rootfs_size }} + 100))
        dd if=/dev/zero of="$image_path" bs=1M count=$total_size_mb status=progress
        parted -s "$image_path" mklabel gpt
        parted -s "$image_path" mkpart primary fat32 1MiB $((512 + 1))MiB
        parted -s "$image_path" set 1 boot on
        parted -s "$image_path" set 1 esp on
        parted -s "$image_path" name 1 "BOOT"
        parted -s "$image_path" mkpart primary btrfs $((512 + 1))MiB 100%
        parted -s "$image_path" name 2 "ROOTFS"
        loop_dev=$(sudo losetup -fP --show "$image_path")
        sudo mkfs.vfat -F 32 -n "BOOT" "${loop_dev}p1"
        sudo mkfs.btrfs -L "ROOTFS" "${loop_dev}p2"
        mkdir -p build/image_mnt/boot build/image_mnt/root
        sudo mount "${loop_dev}p1" build/image_mnt/boot
        sudo mount "${loop_dev}p2" build/image_mnt/root -o compress=zstd:1
        sudo rsync -a build/rootfs/boot/ build/image_mnt/boot/
        sudo rsync -a --exclude=/boot build/rootfs/ build/image_mnt/root/
        sudo mkdir -p build/image_mnt/root/boot
        sudo umount build/image_mnt/boot build/image_mnt/root
        sudo losetup -d $loop_dev
        gzip -6 "$image_path"
        sha256sum "${image_path}.gz" > "${image_path}.gz.sha256"
        echo "IMAGE_PATH=${image_path}.gz" >> $GITHUB_ENV
        echo "IMAGE_SHA256=$(cat ${image_path}.gz.sha256 | cut -d' ' -f1)" >> $GITHUB_ENV
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: fnnas-hisilicon-ec6100v9c-${{ github.event.inputs.kernel_version }}
        path: out/*.img.gz*
        retention-days: 30
    - name: Create Release
      if: github.event_name == 'workflow_dispatch'
      uses: softprops/action-gh-release@v1
      with:
        tag_name: fnnas-hisilicon-ec6100v9c-${{ github.event.inputs.kernel_version }}-${{ github.run_number }}
        name: FnNAS Hi3798MV100 EC6100V9C - Kernel ${{ github.event.inputs.kernel_version }}
        body: |
          FnNAS image for EC6100V9C STB with Hi3798MV100 SoC

          **Hardware:**
          - SoC: HiSilicon Hi3798MV100 (4x Cortex-A7 @ 1.5GHz)
          - RAM: 1GB DDR3
          - Flash: 8GB eMMC
          - Ethernet: 1x 100Mbps
          - USB: 2x USB 2.0

          **Software:**
          - Kernel: ${{ github.event.inputs.kernel_version }} + Hi3798MV100 support
          - Base: fnOS ARM64 (Debian-based)
          - Builder: ${{ github.event.inputs.builder_name }}

          **Installation:**
          1. Download the .img.gz file
          2. Decompress: gzip -d fnnas_hisilicon_ec6100v9c_*.img.gz
          3. Write to USB/SD: sudo dd if=fnnas_hisilicon_ec6100v9c_*.img of=/dev/sdX bs=4M status=progress
          4. Boot from USB/SD, then run fnnas-install to flash to eMMC
        draft: false
        prerelease: true
        files: |
          out/*.img.gz
          out/*.gz.sha256
